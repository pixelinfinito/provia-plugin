# provia-skills 1.2.0
# Esqueleto de desenho (provia-workflow-designer). Não validado: a validação
# com scripts/validate-workflow.mjs pertence a provia-workflow-package.
# Os responsáveis das acções decidir_chefia (grupo «Chefias») e
# confirmar_cabimento (grupo «Finanças») ficam por atribuir no destino;
# ver provia-project.json (assigneeRef) e as decisões D1–D10.
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: Pedido de compra
  prefix: COMP
  description: >-
    Pedido de compra com aprovação da chefia e confirmação da disponibilidade
    orçamental pelas Finanças. Desenhado a partir da descrição verbal do
    procedimento de compras (fonte pedido-compras-2026-09-21).
triggers:
  - type: manual
    label: Iniciar pedido de compra
    enabled: true
    config: {}
fields:
  - name: purchase_description
    label: Descrição da compra
    type: text
    required: true
    width: full
  - name: purchase_amount
    label: Montante estimado (Kz)
    type: currency
    required: true
    width: half
    config:
      currency: AOA
  - name: cost_centre
    label: Centro de custo
    type: text
    required: true
    width: half
  - name: purchase_justification
    label: Justificação da necessidade
    type: rich_text
    required: true
    width: full
  - name: supplier_quotation
    label: Proposta do fornecedor
    type: file
    required: false
    width: full
  - name: budget_reference
    label: Referência de cabimento
    type: text
    required: false
    width: half
entities:
  mode: none
# Secção access gerada a partir de provia-project.json (scripts/emit-workflow-access.mjs):
# qualquer colaborador abre um pedido; Chefias e Finanças vêem os casos que lhes chegam.
access:
  grants:
    - grantee: organization
      level: create_incident
actions:
  - id: registar_pedido
    name: Registar o pedido de compra
    type: standard
    executionMode: sequential
    required: true
    priority: normal
    assignee:
      type: creator
    description: |-
      Tarefa: Registar o pedido de compra com a necessidade, o montante estimado e a justificação, para que a chefia possa decidir.
      Como: 1. Descrever o bem ou serviço a adquirir em `purchase_description`. 2. Indicar o montante estimado em Kz em `purchase_amount` e o centro de custo em `cost_centre`. 3. Explicar a necessidade e a urgência em `purchase_justification`. 4. Se já tiver uma proposta de fornecedor, anexá-la em `supplier_quotation`. 5. Concluir a acção para enviar o pedido à chefia.
      Evidência: Os campos `purchase_description`, `purchase_amount`, `cost_centre` e `purchase_justification` preenchidos; a proposta do fornecedor anexada quando existir.
      Concluído quando: Os campos obrigatórios estão preenchidos e a acção está concluída.
      Excepções: Se o pedido foi devolvido pela chefia ou pelas Finanças, ler o comentário da devolução, corrigir o que foi indicado e concluir de novo a acção. Se não souber o centro de custo, perguntar à sua chefia antes de concluir.
  - id: decidir_chefia
    name: Decidir sobre o pedido de compra
    type: decision
    executionMode: sequential
    required: true
    priority: normal
    description: |-
      Tarefa: Decidir se o pedido de compra avança para a confirmação orçamental das Finanças.
      Como: 1. Ler a descrição, a justificação e o montante em `purchase_amount`. 2. Confirmar que a necessidade é real e que a compra é adequada ao trabalho da equipa. 3. Escolher «Aprovar» para enviar às Finanças, «Devolver» para pedir correcções ao requerente ou «Rejeitar» para encerrar o pedido.
      Evidência: Comentário com o motivo, obrigatório em «Devolver» e «Rejeitar».
      Concluído quando: A decisão está registada com o comentário exigido.
      Excepções: Se o pedido é seu ou de alguém que não chefia, não decidir: comentar e pedir ao gestor do processo que reatribua a acção à chefia competente. Se faltar informação para decidir, escolher «Devolver» e indicar o que falta.
    config:
      branches:
        - label: Aprovar
          outcome: continue
          requiresComment: false
        - label: Devolver
          outcome: return_to_action
          target: registar_pedido
          requiresComment: true
        - label: Rejeitar
          outcome: cancel_incident
          requiresComment: true
  - id: confirmar_cabimento
    name: Confirmar a disponibilidade orçamental
    type: decision
    executionMode: sequential
    required: true
    priority: normal
    description: |-
      Tarefa: Confirmar se existe cabimento orçamental para o montante do pedido aprovado pela chefia.
      Como: 1. Ler o montante em `purchase_amount` e o centro de custo em `cost_centre`. 2. Verificar o saldo disponível da rubrica correspondente no sistema orçamental usado pelas Finanças. 3. Se o saldo cobre o montante, registar a referência de cabimento em `budget_reference`, anexar a captura ou o extracto do saldo com data e escolher «Cabimento confirmado». 4. Se não cobre, escolher «Sem cabimento» e comentar o valor disponível e a alternativa possível.
      Evidência: `budget_reference` preenchido e captura ou extracto do saldo com data anexado em «Cabimento confirmado»; comentário obrigatório com o défice em «Sem cabimento».
      Concluído quando: A decisão está registada com a referência de cabimento ou com o comentário do défice.
      Excepções: Se a rubrica não existir para o centro de custo indicado, ou se o montante não corresponder ao que a chefia aprovou, não confirmar: comentar a diferença e escolher «Sem cabimento» para devolver ao requerente.
    config:
      branches:
        - label: Cabimento confirmado
          outcome: continue
          requiresComment: false
        - label: Sem cabimento
          outcome: return_to_action
          target: registar_pedido
          requiresComment: true
