# provia-skills 1.2.1 — draft. Forms, form links and owners are configured in Provia; see setup.md and provia-project.json.
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: "Supplier quotation collection"
  prefix: QUO
  description: "Collects three supplier quotations inside a case and records one selected quotation as the case amount. Draft for review; owners, deadlines and the approval of the selected amount are not configured."
triggers:
  - type: manual
    label: Start quotation collection
    enabled: true
    config: {}
fields:
  - name: requested_item
    label: Requested item or service
    type: text
    required: false
    width: full
  - name: quotations_collected
    label: Quotations collected
    type: number
    required: false
    width: third
  - name: selected_supplier
    label: Selected supplier
    type: text
    required: false
    width: half
  - name: selected_quotation_reference
    label: Selected quotation reference
    type: text
    required: false
    width: half
  - name: incident_amount
    label: Case amount (selected quotation)
    type: currency
    required: false
    width: third
    config:
      currency: AOA
      decimals: 2
  - name: selection_rationale
    label: Why this quotation was selected
    type: rich_text
    required: false
    width: full
  - name: single_source_justification
    label: Justification for fewer than three quotations
    type: text
    required: false
    width: full
access:
  grants:
    - grantee: "group:Procurement"
      level: create_incident
actions:
  - id: collect-quotations
    name: Collect supplier quotations
    type: form_fill
    description: |-
      Task: Collect **three supplier quotations** for the requested item, one Form Fill response per supplier.

      How:

      1. Open the form **Supplier quotation** on this action and submit one response per supplier.
      2. In each response record the supplier, the quotation reference and date, the quoted amount in `quotation_amount`, the validity and the delivery time, and attach the supplier's quotation document.
      3. Repeat until three responses exist. *Do not edit or reuse an earlier response to record the next supplier: each supplier needs its own response.*
      4. Leave the case amount empty here. **The responses on this action are a review collection and do not write any case field.** The amount reaches the case at the next action.

      Evidence:

      - Three responses to **Supplier quotation**, each with the quotation file attached (PDF, JPG or PNG, up to 10 MB).
      - A case comment naming any supplier that declined or did not answer, with the date it was asked.

      Done when: Three responses are visible on this action with their quotation files attached, or the exception below is recorded in a comment.

      Exceptions: If fewer than three suppliers quote, do not complete with an empty record: submit the responses obtained, comment which suppliers were approached and when, and record the reason in `single_source_justification` at the next action. If a single supplier is the only possible source, ask the process owner before continuing.
    executionMode: sequential
    required: true
  - id: record-selected-quotation
    name: Record the selected quotation
    type: form_fill
    description: |-
      Task: Record which of the collected quotations was selected and write its amount into the case.

      How:

      1. Read the responses to **Collect supplier quotations** side by side: amount, delivery time, validity and whether the scope matches the request.
      2. Open the form **Quotation selection** and submit **one** response. This action is configured for a single response, which is what allows it to write the case fields.
      3. Copy the selected quotation's amount into `selected_amount` exactly as it appears on the supplier's document, in Kz and on the same tax basis for every quotation compared.
      4. Name the supplier and the quotation reference, and write why that quotation was selected — including the reason when it is not the lowest amount.
      5. After submitting, check the case fields the response wrote: `incident_amount`, `selected_supplier`, `selected_quotation_reference` and `quotations_collected`.

      Evidence:

      - One response to **Quotation selection** with `selection_rationale` filled.
      - `incident_amount` on the case equal to the amount on the attached quotation of the selected supplier.
      - `single_source_justification` filled whenever fewer than three quotations were collected.

      Done when: The case carries one selected supplier and one amount, and those values match the selected supplier's quotation document.

      Exceptions:

      - If two quotations are equivalent, or the choice needs an authority you do not hold, do not submit: comment the comparison and ask the process owner to decide.
      - If the selected quotation is revised after you submit, do not expect a second response to correct the case: **this action accepts one response**. Comment the revision and ask the process owner to correct `incident_amount` in the case metadata.
    executionMode: sequential
    required: true
