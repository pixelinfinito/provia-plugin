# provia-skills 1.2.0
# Skeleton produced by provia-form-designer to carry the quotation collection segment.
# Assignees are group keys in provia-project.json (assigneeRef); the YAML leaves them
# unset until destination ids exist. Forms are not packaged here: see quotation-form.md.
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: Purchase request
  prefix: COMP
  description: >-
    Purchase request with collection of three supplier quotations. Each quotation is
    one Form Fill response; the winning quotation is chosen in a separate review
    action that fills the incident amount.
triggers:
  - type: manual
    label: Start purchase request
    enabled: true
    config: {}
entities:
  mode: none
fields:
  - name: item_description
    label: Item or service requested
    type: text
    required: true
    width: full
  - name: quantity
    label: Quantity
    type: number
    required: true
    width: third
  - name: estimated_amount
    label: Estimated amount (Kz)
    type: currency
    required: false
    width: third
    config:
      currency: AOA
  - name: purchase_amount
    label: Purchase amount (Kz)
    type: currency
    required: false
    width: third
    config:
      currency: AOA
  - name: selected_supplier
    label: Selected supplier
    type: text
    required: false
    width: half
  - name: selected_quotation_reference
    label: Selected quotation reference
    type: text
    required: false
    width: half
  - name: quotations_received
    label: Number of quotations received
    type: number
    required: false
    width: third
  - name: selection_rationale
    label: Reason for the selection
    type: rich_text
    required: false
    width: full
access:
  default: creator_only
actions:
  - id: register-quotation
    type: form_fill
    name: Register the supplier quotations received
    description: |-
      Task: Register each supplier quotation received for this purchase request as one response to the form "Supplier quotation", until three quotations are on the case.
      How: 1. Request written quotations from at least three suppliers for the item in `item_description` and the quantity in `quantity`. 2. When a quotation arrives, open this action and submit one response of the form "Supplier quotation" with the supplier name, the quotation reference and date, the amount in Kz, the validity date and the quotation document. 3. Repeat one response per quotation; do not combine two suppliers in one response and do not edit a response to replace a supplier.
      Evidence: Three submitted responses of the form "Supplier quotation", each with its quotation document attached.
      Done when: Three responses are recorded on the case, each with an amount and a document, and no response duplicates a supplier.
      Exceptions: If fewer than three suppliers answer within the period set by the purchasing procedure, do not complete: add a comment naming the suppliers contacted and the dates, and ask the purchasing lead whether the case may continue with fewer quotations.
    executionMode: sequential
    required: true
    priority: normal
    config: {}
  - id: select-quotation
    type: standard
    name: Select the winning quotation
    description: |-
      Task: Choose one of the submitted quotations and record its amount and supplier on the case.
      How: 1. Open the responses of the form "Supplier quotation" on this case and compare amount, validity date, delivery time and whether the amount includes tax. 2. Check that the chosen quotation is still within its validity date. 3. Fill `purchase_amount` with the amount of the chosen quotation, `selected_supplier` with its supplier name, `selected_quotation_reference` with its reference and `quotations_received` with the number of responses. 4. Write in `selection_rationale` why this quotation was chosen, especially when it is not the lowest amount.
      Evidence: The four fields filled from one existing response and the rationale written on the case.
      Done when: `purchase_amount` equals the amount of one submitted response and the selected supplier and reference identify that same response.
      Exceptions: If every quotation has expired or none meets the request, do not complete: comment the reason and return the case to the previous action so new quotations are collected.
    executionMode: sequential
    required: true
    priority: normal
    config: {}
