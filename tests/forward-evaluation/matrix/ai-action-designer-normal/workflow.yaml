# provia-skills 1.2.0
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: Selecção de fornecedor com resumo de propostas
  prefix: SELF
  description: >-
    Recolhe as propostas dos fornecedores, produz um resumo comparativo preparado por IA
    e regista a escolha do fornecedor feita pela equipa de Compras. A IA resume; a
    equipa decide.
  targetDurationDays: 5
  targetDurationType: workdays
  agentMemoryEnabled: false

triggers:
  - type: manual
    label: Iniciar selecção de fornecedor
    enabled: true
    config: {}

entities:
  mode: none

fields:
  - name: objecto_da_compra
    label: Objecto da compra
    type: text
    required: true
    width: full
  - name: orcamento_estimado
    label: Orçamento estimado (Kz)
    type: currency
    required: false
    width: half
  - name: criterios_de_avaliacao
    label: Critérios de avaliação
    type: rich_text
    required: true
    width: full
  - name: numero_de_propostas
    label: Número de propostas anexadas
    type: number
    required: true
    width: half
  - name: resumo_das_propostas
    label: Resumo das propostas
    type: rich_text
    required: false
    width: full
  - name: alertas_do_resumo
    label: Alertas do resumo (lacunas e contradições)
    type: rich_text
    required: false
    width: full
  - name: fornecedor_escolhido
    label: Fornecedor escolhido
    type: text
    required: false
    width: half
  - name: motivo_da_escolha
    label: Motivo da escolha
    type: rich_text
    required: false
    width: full

access:
  grants:
    - grantee: group:Compras
      level: create_incident

actions:
  - id: registar-propostas
    type: standard
    name: Registar o pedido e anexar as propostas dos fornecedores
    description: |-
      Tarefa: Registar o objecto da compra, os critérios de avaliação e anexar ao processo todas as propostas de fornecedores recebidas.
      Como: 1. Preencher `objecto_da_compra` com a descrição do bem ou serviço e, se conhecido, `orcamento_estimado`. 2. Escrever em `criterios_de_avaliacao` os critérios que a equipa vai usar (por exemplo preço total, prazo de entrega, garantia, condições de pagamento), pela ordem de importância. 3. Anexar cada proposta como um ficheiro separado, com o nome do fornecedor no nome do ficheiro (por exemplo `proposta-fornecedorA.pdf`). 4. Registar em `numero_de_propostas` o número de ficheiros anexados.
      Evidência: Os ficheiros das propostas anexados ao processo, um por fornecedor; `objecto_da_compra`, `criterios_de_avaliacao` e `numero_de_propostas` preenchidos.
      Concluído quando: O número de ficheiros de propostas anexados é igual a `numero_de_propostas` e os critérios de avaliação estão escritos.
      Excepções: Se uma proposta chegou apenas por e-mail ou em papel, digitalizar ou guardar o e-mail em PDF e anexar; se um fornecedor não enviou a proposta dentro do prazo, comentar o nome do fornecedor e a data-limite antes de concluir.
    executionMode: sequential
    required: true
    priority: normal
    assignee:
      type: creator

  - id: resumir-propostas
    type: standard
    name: Resumir as propostas dos fornecedores
    description: |-
      Tarefa: Rever o resumo comparativo das propostas preparado pela IA e confirmar que reflecte fielmente as propostas anexadas antes de o entregar à equipa que escolhe o fornecedor.
      Como: 1. Abrir `resumo_das_propostas` e o ficheiro `resumo-propostas.md` anexado pela IA. 2. Para cada fornecedor, conferir na proposta original o preço total, o prazo de entrega, a validade da proposta e as condições de pagamento; corrigir no campo qualquer valor que não corresponda ao documento. 3. Ler `alertas_do_resumo`: confirmar se cada lacuna ou contradição apontada existe de facto e acrescentar as que a IA não detectou. 4. Verificar que o resumo não contém recomendação, classificação ou preferência por um fornecedor; se contiver, apagar essa parte. 5. Confirmar que o número de fornecedores resumidos é igual a `numero_de_propostas`.
      Evidência: `resumo_das_propostas` e `alertas_do_resumo` revistos; um comentário com «Resumo conferido com os originais» e a lista das correcções feitas (ou «sem correcções»).
      Concluído quando: Todos os fornecedores anexados constam do resumo com os valores conferidos, os alertas foram confirmados e o comentário de conferência está registado.
      Excepções: Se a IA não produziu resumo, produziu um resumo com fornecedores em falta, ou o resumo contém erros em mais de um valor por fornecedor, não concluir: escrever o resumo manualmente no campo `resumo_das_propostas` a partir dos originais, registar em comentário o que falhou e concluir. Se uma proposta anexada está ilegível ou incompleta, comentar qual, concluir com o resumo das restantes e, na acção seguinte, escolher «Pedir esclarecimentos» para o processo voltar ao requerente.
    executionMode: sequential
    required: true
    priority: normal
    due:
      offsetDays: 1
      offsetType: workdays
      basis: activation
    aiWorker:
      instructions: |-
        Objectivo: preparar um resumo comparativo, neutro e verificável das propostas de fornecedores anexadas a este processo, para que a equipa de Compras escolha o fornecedor. Não escolher, recomendar, classificar nem ordenar fornecedores por preferência.

        Entradas: os ficheiros anexados ao processo (uma proposta por fornecedor); os campos `objecto_da_compra`, `orcamento_estimado`, `criterios_de_avaliacao` e `numero_de_propostas`.

        Regras:
        1. Usar apenas o conteúdo dos ficheiros anexados e dos campos indicados. Não inventar valores, prazos ou condições que não estejam escritos numa proposta.
        2. Para cada proposta extrair: nome do fornecedor, preço total e moeda, indicação se o preço inclui IVA ou outros impostos quando a proposta o diga, prazo de entrega ou execução, validade da proposta, condições de pagamento, garantia e exclusões declaradas. Quando um dado não consta da proposta, escrever «não indicado» e nunca estimar.
        3. Apresentar os fornecedores pela ordem dos ficheiros anexados, não por mérito.
        4. Para cada critério listado em `criterios_de_avaliacao`, indicar o que cada proposta diz sobre esse critério, citando a página ou secção da proposta de onde o dado foi retirado.
        5. Não escrever frases como «a melhor proposta», «recomenda-se», «o fornecedor mais vantajoso» ou qualquer conclusão sobre qual escolher. A escolha é feita pela equipa.
        6. Quando duas partes da mesma proposta se contradizem (por exemplo preço diferente na tabela e no texto), registar ambos os valores e o local de cada um em `alertas_do_resumo`, sem escolher um deles.
        7. Quando o número de propostas legíveis é diferente de `numero_de_propostas`, quando uma proposta está ilegível, noutra moeda sem indicação da taxa, ou não se refere ao `objecto_da_compra`, registar o facto em `alertas_do_resumo` e continuar com as restantes.
        8. Quando `criterios_de_avaliacao` está vazio, usar apenas os dados da regra 2 e registar em `alertas_do_resumo` que os critérios não foram indicados.
        9. Se não for possível ler nenhuma proposta, não escrever no campo `resumo_das_propostas`; registar o motivo em `alertas_do_resumo` e terminar sem resumo.

        Saída:
        - `resumo_das_propostas`: uma tabela comparativa (linhas = critérios e dados da regra 2; colunas = fornecedores) seguida de um parágrafo curto por fornecedor com os factos relevantes e a respectiva referência de página. Máximo 600 palavras.
        - `alertas_do_resumo`: lista de lacunas, contradições e propostas não consideradas, uma por linha, cada uma com o fornecedor e o local no documento. Escrever «Sem alertas» quando não houver.
        - Ficheiro `resumo-propostas.md` com o mesmo conteúdo dos dois campos, em Markdown.
        Escrever em português de Angola. Valores monetários na moeda da proposta, com o formato original.
      readableFields:
        - objecto_da_compra
        - orcamento_estimado
        - criterios_de_avaliacao
        - numero_de_propostas
      writableFields:
        - resumo_das_propostas
        - alertas_do_resumo
      requiredArtifacts:
        - filenamePattern: resumo-propostas*.md
          mime: text/markdown
          maxBytes: 262144
          description: Resumo comparativo das propostas em Markdown, com referências de página
      mode: safe
      reviewRequired: true
      confidenceThreshold: 0.7
      limits:
        timeoutSeconds: 600
        maxRetries: 1

  - id: escolher-fornecedor
    type: decision
    name: Escolher o fornecedor
    description: |-
      Tarefa: Escolher o fornecedor para o objecto da compra, com base nas propostas anexadas e no resumo conferido, e registar a escolha e o seu motivo.
      Como: 1. Ler `resumo_das_propostas` e `alertas_do_resumo` e abrir as propostas originais dos fornecedores em análise. 2. Comparar as propostas segundo `criterios_de_avaliacao`, pela ordem de importância registada. 3. Escrever em `fornecedor_escolhido` o nome do fornecedor tal como consta da proposta e em `motivo_da_escolha` os critérios que decidiram a escolha e o valor total da proposta escolhida. 4. Escolher «Fornecedor escolhido» quando a escolha está registada; «Pedir esclarecimentos» quando falta informação de um ou mais fornecedores; «Cancelar a selecção» quando a compra deixa de ser necessária ou nenhuma proposta serve.
      Evidência: `fornecedor_escolhido` e `motivo_da_escolha` preenchidos antes de escolher «Fornecedor escolhido»; comentário obrigatório em «Pedir esclarecimentos» e «Cancelar a selecção» com o que falta ou o motivo do cancelamento.
      Concluído quando: A decisão fica registada com os campos e o comentário exigidos.
      Excepções: Se o valor da proposta escolhida exceder a autoridade da equipa para adjudicar, não escolher «Fornecedor escolhido»: comentar o montante e a autoridade necessária e escolher «Pedir esclarecimentos» para o processo voltar ao requerente com a indicação de quem deve decidir. Se o resumo e a proposta original divergirem num valor, a proposta original prevalece.
    executionMode: sequential
    required: true
    priority: normal
    due:
      offsetDays: 3
      offsetType: workdays
      basis: activation
    config:
      branches:
        - label: Fornecedor escolhido
          outcome: continue
          requiresComment: false
        - label: Pedir esclarecimentos
          outcome: return_to_action
          target: registar-propostas
          requiresComment: true
        - label: Cancelar a selecção
          outcome: cancel_incident
          requiresComment: true
