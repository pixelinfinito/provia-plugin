# provia-skills 1.1.0 — rascunho para Angola a partir de duas fontes parciais; a autoridade de aprovação está em conflito (ver provia-project.json, decisões D1–D3). Não publicar sem confirmação da organização.
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: "Aprovação de pedidos de compra"
  prefix: COMP
  description: "Desenhado a partir do procedimento de compras de 2024 e da circular da direcção de 2026. As duas fontes indicam autoridades de aprovação diferentes; o responsável da decisão não está atribuído até a organização resolver o conflito. Nenhuma etapa antes ou depois da decisão está descrita nas fontes."
triggers:
  - type: manual
    label: Iniciar pedido de compra
    enabled: true
    config: {}
actions:
  - id: decidir
    name: Decidir sobre o pedido de compra
    type: decision
    description: |
      Tarefa: Decidir se o pedido de compra avança, com base na necessidade descrita no caso.
      Como: 1. Ler a descrição do pedido registada no título e nos comentários do caso, incluindo qualquer documento anexado. 2. Confirmar que tem autoridade para aprovar este pedido segundo a regra actualmente em vigor na organização. 3. Escolher «Aprovar» para avançar ou «Rejeitar» para encerrar o pedido.
      Evidência: Um comentário com o motivo é obrigatório em «Rejeitar».
      Concluído quando: A decisão está registada, com o comentário exigido quando aplicável.
      Excepções: Se não tiver a certeza de que possui autoridade para decidir este pedido — por exemplo por existirem regras internas contraditórias sobre quem aprova — não decidir: comente o caso e encaminhe-o para confirmação junto da direcção antes de decidir.
    executionMode: sequential
    required: true
    config:
      branches:
        - label: Aprovar
          outcome: continue
        - label: Rejeitar
          outcome: cancel_incident
          requiresComment: true
