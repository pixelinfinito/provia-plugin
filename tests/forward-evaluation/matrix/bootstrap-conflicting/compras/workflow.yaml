# provia-skills 1.2.0
# Access section from provia-project.json (compras): 1 grant(s).
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: Pedido de compra
  prefix: COMP
  description: "Pedido de compra apresentado por um departamento e submetido à autoridade de aprovação em vigor. Desenho a partir do Procedimento de compras (2024) e da Circular da direcção (2026); a autoridade de aprovação está em decisão (D1)."
  version: 1
triggers:
  - type: manual
    label: Iniciar pedido de compra
    enabled: true
    config: {}
entities:
  mode: entity_type
  entityType: Departamento
  requirement: required
fields:
  - name: purchase_description
    label: O que se pretende comprar
    type: text
    required: true
    width: full
  - name: purchase_amount
    label: Montante estimado (Kz)
    type: currency
    required: true
    width: half
    config:
      currency: AOA
  - name: needed_by
    label: Data pretendida
    type: date
    required: false
    width: half
  - name: justification
    label: "Justificação"
    type: rich_text
    required: true
    width: full
access:
  grants:
    - grantee: organization
      level: create_incident
actions:
  - id: preparar
    name: Preparar o pedido de compra
    type: standard
    description: |
      Tarefa: Completar o pedido de compra com a descrição, o montante e a justificação necessários à decisão.
      Como: 1. Confirmar que o departamento requerente está associado ao caso e que a descrição em `purchase_description` identifica o bem ou serviço e a quantidade. 2. Registar o montante estimado em `purchase_amount` (Kz) e, se souber, a data pretendida em `needed_by`. 3. Escrever em `justification` a necessidade e o uso previsto. 4. Anexar ao caso a proposta ou orçamento do fornecedor, quando existir. 5. Se o pedido lhe foi devolvido, ler o comentário da decisão e corrigir os pontos indicados antes de concluir.
      Evidência: Campos `purchase_description`, `purchase_amount` e `justification` preenchidos; ficheiro da proposta anexado ao caso quando existir.
      Concluído quando: Os campos obrigatórios estão preenchidos e o pedido diz o que se pretende comprar, por quanto e porquê.
      Excepções: Se ainda não houver montante estimado, não concluir: comentar no caso o que falta e obter o orçamento antes de submeter.
    executionMode: sequential
    required: true
    priority: normal
    assignee:
      type: creator
  - id: decidir
    name: Decidir sobre o pedido de compra
    type: decision
    description: |
      Tarefa: Decidir se o pedido de compra é aprovado, devolvido para correcção ou rejeitado.
      Como: 1. Ler a descrição, o montante em `purchase_amount` e a justificação em `justification`, e abrir a proposta anexada ao caso. 2. Confirmar que a compra corresponde a uma necessidade do departamento associado ao caso e que o montante é coerente com a proposta. 3. Escolher «Aprovar» quando o pedido pode avançar, «Devolver ao requerente» quando falta informação ou há correcções a fazer, ou «Rejeitar» quando a compra não deve realizar-se.
      Evidência: Um comentário com o motivo é obrigatório em «Devolver ao requerente» e em «Rejeitar»; em «Aprovar», registar no comentário qualquer condição imposta.
      Concluído quando: A decisão fica registada no caso com o comentário exigido.
      Excepções: Se não tiver autoridade para decidir este pedido, não decidir: comentar no caso quem deve decidir e escolher «Devolver ao requerente» para que o pedido seja reencaminhado.
    executionMode: sequential
    required: true
    priority: normal
    config:
      branches:
        - label: Aprovar
          outcome: continue
          requiresComment: false
        - label: Devolver ao requerente
          outcome: return_to_action
          target: preparar
          requiresComment: true
        - label: Rejeitar
          outcome: cancel_incident
          requiresComment: true
