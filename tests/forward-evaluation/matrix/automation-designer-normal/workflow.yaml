# provia-skills 1.2.0
# Esqueleto de integração: envio do pedido aprovado ao ERP.
# O endpoint, o corpo, os códigos esperados e os mapeamentos são MARCADORES até a documentação
# da API do ERP ser recebida (ver integration-erp.md, secção 3, e setup.md). Não importar tal como está.
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: Pedido de compra
  prefix: PC
  description: Pedido de compra com aprovação pela chefia e envio automático do pedido aprovado ao ERP.
triggers:
  - type: manual
    label: Iniciar pedido de compra
    enabled: true
    config: {}
fields:
  - name: request_number
    label: Número do pedido
    type: auto_number
    required: false
    config:
      prefix: PC-
      padding: 6
      startAt: 1
  - name: purchase_description
    label: Descrição da compra
    type: text
    required: true
    width: full
  - name: purchase_amount
    label: Montante (Kz)
    type: currency
    required: true
    width: half
  - name: supplier_name
    label: Fornecedor
    type: text
    required: true
    width: half
  - name: cost_center
    label: Centro de custo
    type: text
    required: true
    width: half
  - name: erp_document_id
    label: Documento no ERP
    type: text
    required: false
    width: half
  - name: erp_status
    label: Estado no ERP
    type: text
    required: false
    width: half
entities:
  mode: none
access:
  grants:
    - grantee: organization
      level: create_incident
actions:
  - id: preparar
    name: Preparar o pedido de compra
    type: standard
    description: |-
      Tarefa: Preencher o pedido de compra com a descrição, o montante, o fornecedor e o centro de custo.
      Como: 1. Descrever o que se pretende comprar e para quê em `purchase_description`. 2. Registar o montante em `purchase_amount` e o fornecedor em `supplier_name`. 3. Indicar o centro de custo em `cost_center`. 4. Anexar a cotação do fornecedor.
      Evidência: Cotação anexada ao caso; campos `purchase_description`, `purchase_amount`, `supplier_name` e `cost_center` preenchidos.
      Concluído quando: Todos os campos obrigatórios estão preenchidos e a cotação está anexada.
      Excepções: Se ainda não houver cotação, não concluir; comentar o motivo e concluir quando a cotação estiver disponível.
    executionMode: sequential
    required: true
    assignee:
      type: creator
  - id: decidir
    name: Decidir sobre o pedido de compra
    type: decision
    description: |-
      Tarefa: Decidir se o pedido de compra avança, com base na necessidade descrita, no montante e no orçamento do centro de custo.
      Como: 1. Ler a descrição, o montante em `purchase_amount` e a cotação anexada. 2. Confirmar que a compra cabe no orçamento do centro de custo. 3. Escolher «Aprovar», «Devolver» ou «Rejeitar». «Aprovar» envia o pedido automaticamente ao ERP; confirme os dados antes de aprovar.
      Evidência: Um comentário com o motivo é obrigatório em «Devolver» e «Rejeitar».
      Concluído quando: A decisão fica registada com o comentário exigido.
      Excepções: Se o montante exceder a sua autoridade de aprovação, não decidir: comentar e devolver ao requerente para encaminhar à autoridade competente.
    executionMode: sequential
    required: true
    assignee:
      type: creator
    config:
      branches:
        - label: Aprovar
          outcome: continue
          requiresComment: false
        - label: Devolver
          outcome: return_to_action
          target: preparar
          requiresComment: true
        - label: Rejeitar
          outcome: cancel_incident
          requiresComment: true
  - id: enviar-erp
    name: Registar o pedido aprovado no ERP
    type: http_request
    description: |-
      Chamada automática ao ERP executada quando o pedido é aprovado. Envia o número do pedido, a descrição, o montante, o fornecedor e o centro de custo e guarda a referência devolvida pelo ERP em `erp_document_id` e o estado em `erp_status`. Uma única tentativa: se a chamada falhar, o caso continua com aviso e a acção seguinte confirma ou regista manualmente o pedido no ERP. Esta acção regista o pedido; não executa pagamentos nem aprova nada no ERP.
    executionMode: sequential
    required: true
    config:
      endpoint: https://erp.example.com/SUBSTITUIR-PELO-CAMINHO-DOCUMENTADO
      method: POST
      headers:
        - key: Authorization
          value: "Bearer {{secret:ERP_API_TOKEN}}"
          enabled: true
        - key: Content-Type
          value: application/json
          enabled: true
        - key: Idempotency-Key
          value: "<<request_number>>"
          enabled: false
      body:
        type: json
        content: |-
          {
            "externalReference": "<<request_number>>",
            "description": "<<purchase_description>>",
            "amount": "<<purchase_amount>>",
            "currency": "AOA",
            "supplier": "<<supplier_name>>",
            "costCenter": "<<cost_center>>",
            "source": "provia"
          }
      responseMappings:
        - jsonPath: $.id
          targetField: erp_document_id
          required: true
        - jsonPath: $.status
          targetField: erp_status
          required: false
      executionTiming: automatic
      timeoutSeconds: 30
      retryConfig:
        maxAttempts: 1
        failureBehavior: continue_warning
      expectedStatusCodes: [200, 201]
  - id: confirmar-registo-erp
    name: Confirmar o registo do pedido no ERP
    type: standard
    description: |-
      Tarefa: Confirmar que o pedido aprovado ficou registado no ERP uma única vez e que a referência do ERP está no caso.
      Como: 1. Verificar se `erp_document_id` está preenchido. 2. Se estiver, abrir o documento no ERP e conferir número do pedido, montante, fornecedor e centro de custo. 3. Se estiver vazio, pesquisar no ERP pela referência externa (o número do pedido) antes de qualquer novo envio, para evitar duplicados. 4. Se o ERP não tiver o documento, registá-lo manualmente no ERP e copiar a referência para `erp_document_id`.
      Evidência: `erp_document_id` preenchido; captura de ecrã do documento no ERP anexada ao caso.
      Concluído quando: Existe exactamente um documento no ERP para este pedido e a sua referência está em `erp_document_id`.
      Excepções: Se existirem dois documentos no ERP para o mesmo pedido, não concluir: anular o duplicado no ERP segundo o procedimento de Finanças, comentar o ocorrido no caso e só depois concluir. Se o ERP estiver indisponível, comentar e concluir quando voltar a estar disponível.
    executionMode: sequential
    required: true
    assignee:
      type: creator
  - id: notificar-requerente
    name: Informar o requerente do registo no ERP
    type: notification
    description: |-
      Aviso automático ao requerente de que o pedido aprovado ficou registado no ERP, com a referência do documento.
    executionMode: sequential
    required: true
    config:
      recipientType: creator
      channels: [in_app, email]
      subject: Pedido de compra registado no ERP
      messageTemplate: O seu pedido de compra foi aprovado e registado no ERP. Consulte o campo «Documento no ERP» no caso para a referência. Contacte as Finanças se a referência estiver em falta.
