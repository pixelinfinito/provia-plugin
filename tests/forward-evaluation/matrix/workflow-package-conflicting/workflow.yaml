# provia-skills 1.2.0 — rascunho para importação no Provia; ler setup.md e provia-project.json antes de importar.
# As chaves (metadata, fields, actions, assignee, …) são as do contrato provia.ao/v1 e não são traduzíveis;
# nomes, etiquetas, descrições e identificadores locais estão em português (pt-AO).
# O formulário de entrada não viaja neste ficheiro: ver form-pedido.json.
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: "Pedido de despesa"
  prefix: PED
  description: "Pedido de despesa registado pelo requerente, decidido pela chefia e confirmado pelas Finanças quanto ao cabimento orçamental."
triggers:
  - type: manual
    label: Iniciar pedido
    enabled: true
    config: {}
fields:
  - name: montante
    label: Montante estimado
    type: currency
    required: true
    width: half
    config:
      currency: AOA
      decimals: 2
  - name: centro_custo
    label: Centro de custo
    type: text
    required: true
    width: half
  - name: justificacao
    label: Justificação
    type: rich_text
    required: true
    width: full
  - name: data_necessidade
    label: Data em que a despesa é necessária
    type: date
    required: false
    width: half
  - name: referencia_cabimento
    label: Referência do cabimento
    type: text
    required: false
    width: half
access:
  grants:
    - grantee: organization
      level: create_incident
actions:
  - id: registar_pedido
    name: Registar o pedido de despesa
    type: standard
    description: |
      Tarefa: Completar o registo do pedido de despesa de forma que a chefia possa decidir sem perguntar.
      Como: 1. Confirmar que o título do caso identifica o bem ou serviço e a quantidade. 2. Confirmar «Montante estimado» com o valor total em Kz, sem IVA. 3. Confirmar o «Centro de custo» que suportará a despesa. 4. Rever a «Justificação»: a necessidade, a alternativa considerada e a consequência de não comprar. 5. Preencher «Data em que a despesa é necessária» se houver prazo. 6. Anexar a proposta ou o orçamento do fornecedor, quando existir.
      Evidência: «Montante estimado», «Centro de custo» e «Justificação» preenchidos; proposta anexada quando existir.
      Concluído quando: O caso tem título, montante, centro de custo e justificação, e passa à decisão da chefia.
      Excepções: Se o montante ainda não for conhecido, não concluir: pedir uma estimativa ao fornecedor ou ao serviço requisitante e registá-la antes de avançar.
    executionMode: sequential
    required: true
    assignee:
      type: creator
  - id: decidir_chefia
    name: Decidir sobre o pedido
    type: decision
    description: |
      Tarefa: Decidir se o pedido de despesa avança, com base na justificação apresentada e no plano da sua área.
      Como: 1. Ler o título, a «Justificação» e a proposta anexada, se existir. 2. Confirmar que o «Montante estimado» é razoável para o que se pede e que o «Centro de custo» é o correcto. 3. Escolher «Aprovar» para enviar às Finanças, «Devolver» para pedir correcções ao requerente ou «Rejeitar» para encerrar o pedido.
      Evidência: Um comentário com o motivo é obrigatório em «Devolver» e «Rejeitar».
      Concluído quando: A decisão está registada com o comentário exigido.
      Excepções: Se o pedido tiver sido registado por si ou se a despesa exceder a sua autoridade, não decidir: comentar o motivo e devolver ao requerente para que o pedido seja encaminhado à autoridade competente.
    executionMode: sequential
    required: true
    config:
      branches:
        - label: Aprovar
          outcome: continue
        - label: Devolver
          outcome: return_to_action
          target: registar_pedido
          requiresComment: true
        - label: Rejeitar
          outcome: cancel_incident
          requiresComment: true
  - id: confirmar_financas
    name: Confirmar o cabimento orçamental
    type: standard
    description: |
      Tarefa: Confirmar que existe cabimento orçamental para o «Montante estimado» no «Centro de custo» indicado.
      Como: 1. Abrir o mapa orçamental do centro de custo no sistema de contabilidade. 2. Comparar o saldo disponível com o «Montante estimado». 3. Registar a referência do cabimento no campo «Referência do cabimento». 4. Anexar o comprovativo do saldo com a data da consulta.
      Evidência: «Referência do cabimento» preenchida e comprovativo do saldo anexado.
      Concluído quando: O saldo cobre o montante e a referência do cabimento está registada no caso.
      Excepções: Se não houver cabimento, não concluir: comentar o défice apurado e o saldo disponível e informar a chefia que decidiu, pelo comentário, para que reveja o pedido ou indique outro centro de custo.
    executionMode: sequential
    required: true
