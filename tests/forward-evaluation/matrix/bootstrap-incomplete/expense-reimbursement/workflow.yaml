# provia-skills 1.2.0 — draft for review; see setup.md and provia-project.json before importing.
# Access section from provia-project.json (expense-reimbursement): 1 grant(s).
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: Expense reimbursement
  prefix: REIMB
  description: "Employee expense claims: the employee submits receipts, the manager decides, Finance pays. Designed from a three-item checklist; owners, deadlines and limits are open decisions in provia-project.json."
triggers:
  - type: manual
    label: Start expense claim
    enabled: true
    config: {}
fields:
  - name: claim_amount
    label: Total amount claimed
    type: currency
    required: true
    config:
      currency: AOA
      decimals: 2
  - name: expense_period
    label: Expense period
    type: text
    required: true
  - name: expense_category
    label: Main expense category
    type: select
    required: true
    config:
      options:
        - value: travel
          label: Travel
        - value: meals
          label: Meals
        - value: local_transport
          label: Local transport
        - value: accommodation
          label: Accommodation
        - value: supplies
          label: Supplies and small purchases
        - value: other
          label: Other
  - name: business_purpose
    label: Business purpose
    type: text
    required: true
  - name: receipt_count
    label: Number of receipts attached
    type: number
    required: true
  - name: manager
    label: Approving manager
    type: user
    required: true
  - name: paid_amount
    label: Amount paid
    type: currency
    required: false
    config:
      currency: AOA
      decimals: 2
  - name: payment_date
    label: Payment date
    type: date
    required: false
  - name: payment_reference
    label: Payment reference
    type: text
    required: false
access:
  grants:
    - grantee: organization
      level: create_incident
actions:
  - id: submit_claim
    name: Submit the expense receipts
    type: standard
    description: |
      Task: Submit a complete expense claim with every receipt attached so that your manager can decide without asking for more.
      How: 1. Attach every receipt to the claim as a file (a legible scan or photo, PDF, JPG or PNG; one file per receipt or one combined PDF). 2. Fill «Total amount claimed» with the sum of the receipts in kwanzas. 3. Fill «Expense period» with the dates or month the receipts cover. 4. Choose the «Main expense category» and describe in «Business purpose» what the expense was for and which work it supported. 5. Fill «Number of receipts attached». 6. Select your line manager in «Approving manager». 7. If the claim was returned to you for correction, read the manager's comment, correct what was asked and complete the action again.
      Evidence: All receipts attached as files; «Total amount claimed», «Expense period», «Main expense category», «Business purpose», «Number of receipts attached» and «Approving manager» filled.
      Done when: Every receipt is attached, the six fields are filled and the amount claimed equals the sum of the receipts.
      Exceptions: If a receipt is missing or illegible, do not complete: obtain a duplicate from the supplier or a written statement of the expense and attach it. If you do not know who your approving manager is, ask Human Resources before completing.
    executionMode: sequential
    required: true
    assignee:
      type: creator
  - id: approve_claim
    name: Decide on the expense claim
    type: decision
    description: |
      Task: Decide whether the expense claim is approved for payment, returned to the employee for correction, or rejected.
      How: 1. Open each attached receipt and check that it is legible, dated within «Expense period» and matches the «Business purpose». 2. Check that «Total amount claimed» equals the sum of the receipts and that «Number of receipts attached» matches the files. 3. Confirm the expense was necessary for the work described and complies with the expense policy in force. 4. Choose «Approve» to send the claim to Finance for payment, «Return for correction» to send it back to the employee with what must be fixed, or «Reject» to close the claim.
      Evidence: The decision recorded on the claim; a comment with the reason is mandatory on «Return for correction» and «Reject».
      Done when: The decision is recorded with the comment required.
      Exceptions: If you are the claimant, do not decide: comment that the claim must be reassigned to your own manager. If the amount or category exceeds what you are authorised to approve, or no policy covers it, do not approve: comment the question and return the claim so it can be escalated to the authority that can decide.
    executionMode: sequential
    required: true
    config:
      branches:
        - label: Approve
          outcome: continue
        - label: Return for correction
          outcome: return_to_action
          target: submit_claim
          requiresComment: true
        - label: Reject
          outcome: cancel_incident
          requiresComment: true
  - id: pay_claim
    name: Pay the approved reimbursement
    type: standard
    description: |
      Task: Pay the approved amount to the employee within the month and record the payment on the claim.
      How: 1. Read the approved «Total amount claimed» and the manager's decision. 2. Take the employee's payment details from the payroll or accounting system of record; do not ask the employee to post bank details in the claim. 3. Execute the payment by the means Finance uses for reimbursements and book it in the accounting system. 4. Fill «Amount paid», «Payment date» and «Payment reference» (transfer reference or voucher number). 5. Attach the proof of payment.
      Evidence: «Amount paid», «Payment date» and «Payment reference» filled; proof of payment (bank transfer confirmation or cash voucher) attached.
      Done when: The employee has been paid, the three payment fields are filled and the proof of payment is attached.
      Exceptions: If the payment details are missing or the payment fails, do not complete: comment what is missing on the claim and mention the employee so they can resolve it with Finance. If the amount paid differs from the amount claimed, comment the reason before completing.
    executionMode: sequential
    required: true
