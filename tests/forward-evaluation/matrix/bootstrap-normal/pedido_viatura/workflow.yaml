# provia-skills 1.2.0 — Pedido de viatura (procedimento v2, em vigor desde 2026-03-01); ver setup.md e provia-project.json antes de importar.
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: "Pedido de viatura"
  prefix: VIAT
  description: "Pedido de utilização de uma viatura da empresa: verificação de disponibilidade pelo Secretariado, decisão da chefia do colaborador em um dia útil, entrega com quilometragem de saída e devolução com quilometragem de entrada e danos."
  version: 2
triggers:
  - type: manual
    label: Iniciar pedido de viatura
    enabled: true
    config: {}
fields:
  - name: data_utilizacao
    label: Data de utilização
    type: date
    required: true
    group: Pedido
    width: third
    config:
      helpText: Dia em que precisa da viatura.
      constraint: future
  - name: destino
    label: Destino
    type: text
    required: true
    group: Pedido
    width: third
    config:
      helpText: Localidade ou morada do destino.
      maxLength: 200
  - name: motivo
    label: Motivo
    type: text
    required: true
    group: Pedido
    width: full
    config:
      helpText: Trabalho a realizar no destino.
      multiline: true
  - name: chefia_colaborador
    label: Chefia do colaborador
    type: user
    required: true
    group: Pedido
    width: third
    config:
      helpText: A sua chefia de departamento, que decide o pedido. Se for chefe de departamento, indique a Direcção-Geral.
      organizationOnly: true
  - name: viatura
    label: Viatura
    type: entity
    required: false
    group: Reserva
    width: half
    config:
      helpText: Viatura reservada pelo Secretariado para a data pedida.
  - name: cartao_combustivel
    label: Cartão de combustível
    type: text
    required: false
    group: Entrega e devolução
    width: third
    config:
      helpText: Número do cartão de combustível entregue com a chave.
  - name: km_saida
    label: Quilometragem de saída
    type: number
    required: false
    group: Entrega e devolução
    width: third
    config:
      helpText: Leitura do conta-quilómetros no momento da entrega.
      min: 0
      allowDecimals: false
  - name: km_entrada
    label: Quilometragem de entrada
    type: number
    required: false
    group: Entrega e devolução
    width: third
    config:
      helpText: Leitura do conta-quilómetros no momento da devolução.
      min: 0
      allowDecimals: false
  - name: danos_registados
    label: Danos registados
    type: boolean
    required: false
    group: Entrega e devolução
    width: third
    config:
      helpText: Marcar quando a viatura foi devolvida com danos novos.
  - name: descricao_danos
    label: Descrição dos danos
    type: text
    required: false
    group: Entrega e devolução
    width: full
    config:
      helpText: Descrever os danos encontrados na devolução; anexar fotografias ao pedido.
      multiline: true
access:
  grants:
    - grantee: organization
      level: create_incident
actions:
  - id: confirmar_disponibilidade
    name: Confirmar a disponibilidade de viatura para a data pedida
    type: decision
    description: |
      Tarefa: Confirmar se existe uma viatura disponível para a data, o destino e o motivo indicados no pedido e registar qual fica reservada.
      Como: 1. Ler os campos «Data de utilização», «Destino» e «Motivo». 2. Consultar o mapa de viaturas e verificar se há uma viatura operacional livre nessa data, tendo em conta os pedidos já aprovados e as viaturas em manutenção. 3. Se houver, reservar a viatura no mapa e seleccioná-la no campo «Viatura» do pedido. 4. Escolher «Viatura disponível» para enviar o pedido à chefia do colaborador; caso contrário, escolher «Sem viatura disponível».
      Evidência: O campo «Viatura» preenchido em «Viatura disponível»; em «Sem viatura disponível», um comentário obrigatório com a razão e, quando possível, uma data alternativa.
      Concluído quando: A decisão está registada e, havendo disponibilidade, a viatura está reservada no mapa e indicada no campo «Viatura».
      Excepções: Se a data, o destino ou o motivo não forem claros, não decidir: comentar o que falta e pedir ao colaborador que corrija os campos do pedido. Se a única viatura livre estiver em manutenção ou com seguro ou inspecção caducados, tratar como «Sem viatura disponível».
    executionMode: sequential
    required: true
    config:
      branches:
        - label: Viatura disponível
          outcome: continue
        - label: Sem viatura disponível
          outcome: cancel_incident
          requiresComment: true
  - id: decidir_pedido
    name: Decidir sobre o pedido de viatura
    type: decision
    description: |
      Tarefa: Aprovar ou recusar o pedido de viatura de um colaborador do seu departamento no prazo de um dia útil.
      Como: 1. Confirmar que é a chefia indicada no campo «Chefia do colaborador»; se não for, reatribuir a acção a essa pessoa sem decidir. 2. Ler «Data de utilização», «Destino», «Motivo» e a viatura reservada pelo Secretariado no campo «Viatura». 3. Verificar que a deslocação serve o trabalho do departamento e é compatível com o serviço do colaborador nessa data. 4. Escolher «Aprovar» para o Secretariado entregar a viatura, ou «Recusar» para encerrar o pedido.
      Evidência: Um comentário com o motivo é obrigatório em «Recusar».
      Concluído quando: A decisão está registada no prazo de um dia útil depois de a acção lhe ser atribuída.
      Excepções: Se precisar de esclarecimentos, pedi-los ao colaborador por comentário no pedido sem ultrapassar o prazo. Se o pedido for seu ou de alguém que não pertence ao seu departamento, não decidir: reatribuir à Direcção-Geral ou à chefia correcta e comentar.
    executionMode: sequential
    required: true
    due:
      offsetDays: 1
      offsetType: workdays
      basis: activation
    config:
      branches:
        - label: Aprovar
          outcome: continue
        - label: Recusar
          outcome: cancel_incident
          requiresComment: true
  - id: entregar_viatura
    name: Entregar a viatura e registar a quilometragem de saída
    type: standard
    description: |
      Tarefa: Entregar ao colaborador a chave e o cartão de combustível da viatura aprovada e registar a quilometragem de saída.
      Como: 1. Confirmar que o pedido está aprovado e que a viatura no campo «Viatura» é a reservada no mapa. 2. Com o colaborador presente, ler o conta-quilómetros e preencher «Quilometragem de saída». 3. Entregar a chave e o cartão de combustível e preencher «Cartão de combustível» com o número do cartão entregue. 4. Registar num comentário a data e a hora da entrega.
      Evidência: Os campos «Quilometragem de saída» e «Cartão de combustível» preenchidos; um comentário com a data e a hora da entrega.
      Concluído quando: O colaborador tem a chave e o cartão e a quilometragem de saída está registada no pedido.
      Excepções: Se a viatura reservada deixou de estar disponível (avaria, devolução em atraso), não concluir: comentar, reservar outra viatura se existir, actualizar o campo «Viatura» e informar a chefia pelo próprio pedido. Se o colaborador não levantar a viatura na data, comentar, libertar a reserva no mapa e pedir-lhe que confirme uma nova data ou desista do pedido.
    executionMode: sequential
    required: true
  - id: registar_devolucao
    name: Registar a devolução da viatura
    type: standard
    description: |
      Tarefa: Receber a viatura devolvida pelo colaborador e registar a quilometragem de entrada e os danos eventuais.
      Como: 1. Receber a chave e o cartão de combustível e conferir que correspondem à viatura do pedido. 2. Ler o conta-quilómetros e preencher «Quilometragem de entrada»; confirmar que é superior à «Quilometragem de saída». 3. Inspeccionar a viatura com o colaborador; se houver danos novos, marcar «Danos registados», descrevê-los em «Descrição dos danos» e anexar fotografias ao pedido. 4. Actualizar a quilometragem actual no registo da viatura e libertar a viatura no mapa de viaturas. 5. Registar num comentário a data e a hora da devolução.
      Evidência: «Quilometragem de entrada» preenchida; «Danos registados» marcado e «Descrição dos danos» com fotografias quando houver danos; um comentário com a data e a hora da devolução.
      Concluído quando: A chave e o cartão estão de volta ao Secretariado, a quilometragem de entrada está registada e a viatura está livre no mapa.
      Excepções: Se a viatura não for devolvida na data prevista, comentar e contactar o colaborador e a chefia pelo pedido; não concluir até à devolução. Se houver danos, concluir a acção com o registo feito e comunicá-los à Direcção-Geral pelo canal em vigor; o seguimento dos danos não faz parte deste procedimento.
    executionMode: sequential
    required: true
