# provia-skills 1.2.0
# VERSÃO PROPOSTA (rascunho v2) do pedido de compra: alteração dos campos obrigatórios.
# Em modo ligado, criar o rascunho com `workflow_create_draft_version` a partir da versão activa
# e aplicar apenas as diferenças descritas em plano-de-alteracao.md. Não importar este ficheiro
# como novo workflow: a importação cria uma nova linhagem e não preserva a versão nem o histórico.
apiVersion: provia.ao/v1
kind: Workflow
metadata:
  name: Pedido de compra
  prefix: COMP
  description: Pedido de compra interno. Versão proposta com montante estimado, centro de custo e categoria de compra obrigatórios no registo; data de entrega passa a opcional.
  version: 2
triggers:
  - type: manual
    label: Iniciar pedido
    enabled: true
    config: {}
fields:
  - name: request_reference
    label: Referência do pedido
    type: auto_number
    required: false
    config:
      prefix: COMP-
      padding: 4
      startAt: 1
  - name: department
    label: Departamento
    type: select
    required: true
    config:
      options:
        - value: operations
          label: Operações
        - value: finance
          label: Finanças
        - value: it
          label: Tecnologias de informação
        - value: hr
          label: Recursos humanos
  - name: description
    label: Descrição da necessidade
    type: rich_text
    required: true
  - name: purchase_category
    label: Categoria de compra
    type: select
    required: true
    config:
      options:
        - value: goods
          label: Bens
        - value: services
          label: Serviços
  - name: estimated_amount
    label: Montante estimado (Kz)
    type: currency
    required: true
    config:
      currency: AOA
  - name: cost_center
    label: Centro de custo
    type: text
    required: true
  - name: delivery_date
    label: Data pretendida de entrega
    type: date
    required: false
  - name: supplier_name
    label: Fornecedor sugerido
    type: text
    required: false
  - name: budget_reference
    label: Referência de cabimento
    type: text
    required: false
entities:
  mode: none
actions:
  - id: registar
    name: Registar o pedido de compra
    type: standard
    description: |-
      Tarefa: Registar o pedido de compra com a necessidade, o departamento, a categoria, o montante estimado e o centro de custo.
      Como: 1. Preencher `department`, `description` e `purchase_category`. 2. Indicar `estimated_amount` com base na proposta ou numa estimativa fundamentada e `cost_center` conforme o mapa de centros de custo do departamento. 3. Indicar `delivery_date` quando houver prazo pretendido. 4. Anexar a proposta do fornecedor, se existir.
      Evidência: Os campos `department`, `description`, `purchase_category`, `estimated_amount` e `cost_center` preenchidos; proposta anexada quando existe.
      Concluído quando: O pedido tem a necessidade, a categoria, o montante estimado e o centro de custo registados.
      Excepções: Se não souber o centro de custo, não concluir; perguntar à chefia do departamento por comentário e manter o pedido em rascunho. Se o montante for apenas uma estimativa, indicá-lo em `description`.
    executionMode: sequential
    required: true
    assignee:
      type: creator
  - id: verificar_cabimento
    name: Verificar o cabimento orçamental
    type: standard
    description: |-
      Tarefa: Confirmar que existe cabimento orçamental para o montante pedido no centro de custo indicado.
      Como: 1. Ler `estimated_amount` e `cost_center`. 2. Consultar o mapa orçamental do centro de custo no sistema de contabilidade. 3. Registar a referência em `budget_reference`.
      Evidência: `budget_reference` preenchido e captura do saldo anexada.
      Concluído quando: A referência de cabimento está registada e o saldo cobre o montante.
      Excepções: Se não houver cabimento, não concluir; comentar o défice para que a decisão seguinte devolva o pedido ao requerente. Num caso aberto antes desta versão, se `estimated_amount` ou `cost_center` estiverem vazios, pedir os valores ao requerente por comentário antes de consultar o orçamento.
    executionMode: sequential
    required: true
    due:
      offsetDays: 2
      offsetType: workdays
      basis: activation
  - id: decidir
    name: Decidir sobre o pedido de compra
    type: decision
    description: |-
      Tarefa: Decidir se o pedido de compra avança, com base na necessidade descrita e no cabimento confirmado.
      Como: 1. Ler `description`, `estimated_amount` e `budget_reference`. 2. Confirmar que a compra está prevista no plano do departamento. 3. Escolher «Aprovar», «Devolver» ou «Rejeitar».
      Evidência: Comentário obrigatório em «Devolver» e «Rejeitar».
      Concluído quando: A decisão fica registada com o comentário exigido.
      Excepções: Se o montante exceder a sua autoridade, não decidir; comentar e devolver ao requerente para encaminhar à autoridade competente.
    executionMode: sequential
    required: true
    due:
      offsetDays: 3
      offsetType: workdays
      basis: activation
    config:
      branches:
        - label: Aprovar
          outcome: continue
          requiresComment: false
        - label: Devolver
          outcome: return_to_action
          target: registar
          requiresComment: true
        - label: Rejeitar
          outcome: cancel_incident
          requiresComment: true
  - id: confirmar_encomenda
    name: Confirmar a encomenda ao fornecedor
    type: standard
    description: |-
      Tarefa: Emitir a encomenda ao fornecedor e confirmar a data de entrega acordada.
      Como: 1. Emitir a nota de encomenda com o montante aprovado. 2. Enviar ao fornecedor indicado em `supplier_name` ou ao fornecedor seleccionado. 3. Confirmar a data de entrega face a `delivery_date` quando preenchida; caso contrário, acordar a data com o requerente por comentário.
      Evidência: Nota de encomenda anexada ao caso e data de entrega confirmada em comentário.
      Concluído quando: A nota de encomenda está anexada e a entrega confirmada pelo fornecedor.
      Excepções: Se o fornecedor não confirmar a data pretendida, comentar a nova data proposta antes de concluir.
    executionMode: sequential
    required: true
    due:
      offsetDays: 5
      offsetType: workdays
      basis: activation
access:
  grants:
    - grantee: organization
      level: create_incident
